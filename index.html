<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crystal Quest - Puzzle Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Header -->
        <header class="game-header">
            <div class="header-left">
                <button id="back-btn" class="icon-btn">←</button>
            </div>
            <div class="header-center">
                <div class="level-info">
                    <span class="label">Level</span>
                    <span id="level-display" class="value">1</span>
                </div>
                <div class="score-info">
                    <span class="label">Score</span>
                    <span id="score-display" class="value">0</span>
                </div>
                <div class="difficulty-info">
                    <span class="label">Difficulty</span>
                    <span id="difficulty-display" class="value hard">Hard</span>
                </div>
            </div>
            <div class="header-right">
                <button id="settings-btn" class="icon-btn"></button>
            </div>
        </header>

        <!-- Crystal Collection -->
        <div class="crystal-collection">
            <div class="crystals-to-place" id="crystals-to-place">
                <!-- Dynamically filled -->
            </div>
            <div class="mistakes-counter">
                <span class="mistake-label">Mistakes:</span>
                <div class="mistake-hearts" id="mistake-hearts">
                    <span class="heart active">❤</span>
                    <span class="heart active">❤</span>
                    <span class="heart active">❤</span>
                </div>
            </div>
        </div>

        <!-- Rules Info -->
        <div class="rules-container">
            <div class="rule-box">
                <div class="rule-icon">🔷</div>
                <span>1 Crystal per color</span>
            </div>
            <div class="rule-box">
                <div class="rule-icon"></div>
                <span>1 Crystal per row & column</span>
            </div>
            <div class="rule-box">
                <div class="rule-icon"></div>
                <span>Crystals cannot touch</span>
            </div>
        </div>

        <!-- Game Grid -->
        <div class="grid-container" id="grid-container">
            <!-- Grid generated by JavaScript -->
        </div>

        <!-- Hint Buttons -->
        <div class="hints-container">
            <button class="hint-btn" id="hint-reveal" onclick="useHint('reveal')">
                <div class="hint-icon">🔮</div>
                <span class="hint-text">Reveal Crystal</span>
                <span class="hint-count" id="hint-reveal-count">3</span>
            </button>
            <button class="hint-btn" id="hint-hint" onclick="useHint('hint')">
                <div class="hint-icon">💡</div>
                <span class="hint-text">Get Hint</span>
                <span class="hint-count" id="hint-hint-count">3</span>
            </button>
            <button class="hint-btn" id="hint-check" onclick="useHint('check')">
                <div class="hint-icon">🔍</div>
                <span class="hint-text">Check Spot</span>
                <span class="hint-count" id="hint-check-count">3</span>
            </button>
        </div>

        <!-- Modals -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal-content" id="modal-content">
                <!-- Dynamic content -->
            </div>
        </div>

        <!-- Level Complete Modal -->
        <div id="level-complete-modal" class="modal-overlay hidden">
            <div class="modal-content level-complete">
                <h2>🎉 Level Complete!</h2>
                <div class="stars">⭐⭐⭐</div>
                <p>Score: <span id="final-score">0</span></p>
                <button class="primary-btn" onclick="nextLevel()">Next Level</button>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal" class="modal-overlay hidden">
            <div class="modal-content game-over">
                <h2>💔 Game Over</h2>
                <p>You've used all your chances!</p>
                <button class="primary-btn" onclick="retryLevel()">Try Again</button>
                <button class="secondary-btn" onclick="backToMenu()">Main Menu</button>
            </div>
        </div>
    </div>

    <script src="puzzle-generator.js"></script>
    <script src="game.js"></script>
</body>
</html>
