name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 DEBUG: Check Project Structure
      run: |
        echo "=== ROOT DIRECTORY CONTENTS ==="
        ls -la
        echo "=== CONFIG.XML CHECK ==="
        if [ -f "config.xml" ]; then
          echo "✅ config.xml EXISTS!"
          head -n 5 config.xml
        else
          echo "❌ FATAL ERROR: config.xml is MISSING from the root directory!"
          exit 1
        fi
        echo "=== PACKAGE.JSON CHECK ==="
        if [ -f "package.json" ]; then
          echo "✅ package.json EXISTS!"
        else
          echo "❌ FATAL ERROR: package.json is MISSING!"
          exit 1
        fi
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
    - name: Install Android SDK packages
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-33" \
          "platform-tools" \
          "build-tools;33.0.0" \
          "cmdline-tools;latest"
          
    - name: Install Dependencies
      run: |
        npm install
        
    - name: Add Android Platform
      run: |
        # This will now work because we verified config.xml exists
        npx cordova platform add android
        
    - name: Build Release APK
      run: |
        npx cordova build android --release
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: crystal-quest-release-apk
        path: platforms/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: error
