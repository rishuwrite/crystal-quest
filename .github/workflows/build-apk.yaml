name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found."
            find "$ANDROID_HOME" -name sdkmanager -type f || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Verify project files
        shell: bash
        run: |
          set -eux
          test -f config.xml
          test -f package.json
          test -f index.html
          test -f game.js
          test -f puzzle-generator.js
          test -f styles.css

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Cordova web files
        shell: bash
        run: |
          set -eux
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp game.js www/game.js
          cp puzzle-generator.js www/puzzle-generator.js
          cp styles.css www/styles.css

      - name: Clean stale Cordova project
        shell: bash
        run: |
          set -e
          rm -rf platforms plugins
          rm -rf .gradle

      - name: Add compatible Android platform
        shell: bash
        run: |
          npx --no-install cordova platform add android@13.0.0 --no-telemetry

      - name: Force Gradle 8.7
        shell: bash
        run: |
          set -eux
          if [ -f platforms/android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' \
              platforms/android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f platforms/android/gradle.properties ]; then
            echo "org.gradle.jvmargs=-Xmx2048m" >> platforms/android/gradle.properties
          else
            printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m' > platforms/android/gradle.properties
          fi

      - name: Check Android requirements
        run: npx --no-install cordova requirements

      - name: Build debug APK
        run: npx --no-install cordova build android --debug --no-telemetry

      - name: Find generated APK
        shell: bash
        run: |
          set -eux
          find platforms/android -type f -name '*.apk' -print
          APK_PATH="$(find platforms/android -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK generated"
            find platforms/android -type f | sort || true
            exit 1
          fi
          mkdir -p artifact
          cp "$APK_PATH" artifact/crystal-quest-debug.apk
          ls -lh artifact/crystal-quest-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crystal-quest-debug-apk
          path: artifact/crystal-quest-debug.apk
          if-no-files-found: error
          retention-days: 30
