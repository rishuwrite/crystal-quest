name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        # Removed 'cache: npm' to prevent lock file errors
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
    - name: Install required Android SDK packages
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-33" \
          "platform-tools" \
          "build-tools;33.0.0" \
          "cmdline-tools;latest"
          
    - name: Install npm dependencies
      run: |
        npm install
        npm install -g cordova
        
    - name: Add Android platform
      run: |
        cordova platform add android@12
        
    - name: Build Debug APK
      run: |
        cordova build android --debug
        
    - name: Build Release APK (unsigned)
      run: |
        cordova build android --release
        
    - name: List APK outputs
      run: |
        echo "=== Debug APK ==="
        ls -la platforms/android/app/build/outputs/apk/debug/ || echo "Debug APK not found"
        echo "=== Release APK ==="
        ls -la platforms/android/app/build/outputs/apk/release/ || echo "Release APK not found"
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: crystal-quest-debug-apk
        path: platforms/android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: warn
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: crystal-quest-release-apk
        path: platforms/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: warn
